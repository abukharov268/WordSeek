[project]
name = "word-seek"
version = "0.1.0"
description = ""
authors = [{ name = "abukharov268", email = "bukharov.268@gmail.com" }]
requires-python = ">=3.12,<4"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "aiosqlite>=0.21.0,<0.22",
    "curtsies>=0.4.2,<0.5",
    "async-lru>=1.0.3,<2",
    "anyio>=3.6.1,<4",
    "sqlalchemy[asyncio,mypy]>=2.0.36,<3",
    "reactivex>=4.0.4,<5",
    "typer>=0.12.5,<0.13",
    "rich>=13.9.2,<14",
    "greenlet>=3.1.1,<4",
    "beautifulsoup4>=4.13.3,<5",
    "webcolors>=24.11.1,<25",
    "platformdirs>=4.3.8,<5",
    "alembic>=1.16.4,<2",
    "sqlite-icu>=1.0",
]

[project.scripts]
cli = "word_seek.cli.app:app"

[dependency-groups]
dev = [
    "mypy>=1.14.0",
    "pytest-mock>=3.14.0",
    "appdirs-stubs>=0.1.0",
    "pytest>=9.0.3",
    "pytest-aio>=1.9.0",
    "pytest-randomly>=3.16.0",
    "polyfactory>=2.19.0",
    "requirements-parser>=0.13.0",
    "ruff>=0.15.16",
    "faker>=40.21.0",
]
gnome = [
    "pygobject>=3.52.3,<4",
    "pyobject>=1.3.4",
]
gnome-dev = [
    "pygobject-stubs>=2.12.0,<3",
]

[tool.uv]
default-groups = "all"
required-environments = [
    "sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')"
]

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[tool.mypy]
mypy_path = "./typings"
exclude = "^(build|build_aux)/.*"

[[tool.mypy.overrides]]
module = ["webcolors"]
ignore_missing_imports = true

[tool.ruff]
extend-exclude = ["build_aux/flatpak-builder-tools/**"]

[tool.pytest.ini_options]
addopts = "--ignore=build_aux/ --ignore=build/"

